## ftpsync configuration of mirror.blue3.com.br: the Debian archive, every architecture.
## Installed as /etc/ftpsync/ftpsync.conf. Read by /usr/bin/ftpsync and /usr/bin/ftpsync-cron (Debian package
## "ftpsync"), both run as the unprivileged user "mirror" by the systemd units in config/systemd/.

MIRRORNAME="mirror.blue3.com.br"
TO="/srv/mirror/debian/"
MAILTO="mirrors@blue3.com.br"
HUB=false

## Upstream: the C3SL/UFPR mirror (Curitiba), a Debian push mirror close to us that carries every architecture.
## ftpsync-cron reads its trace over HTTP (http://$RSYNC_HOST/$RSYNC_PATH/project/trace/$RSYNC_HOST) and starts a
## sync only when the upstream serial changed.
RSYNC_HOST="debian.c3sl.ufpr.br"
RSYNC_PATH="debian"

## Every architecture Debian publishes, plus source: nothing included or excluded.
ARCH_INCLUDE=""
ARCH_EXCLUDE=""

## Published in project/trace/mirror.blue3.com.br
INFO_MAINTAINER="Blue3 Mirrors <mirrors@blue3.com.br>"
INFO_SPONSOR="Blue3 Internet <https://blue3.com.br>"
INFO_COUNTRY="BR"
INFO_LOCATION="Porto Alegre, Rio Grande do Sul"
INFO_THROUGHPUT="10Gb"

## Outside the served tree (the defaults live under ~/.local)
LOGDIR="/var/log/ftpsync"
LOCKDIR="/var/lib/mirror/lock"
LOGROTATE=14
UIPRETRIES=3
