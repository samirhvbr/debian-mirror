# Large static files (ISO images, .deb). Installed as /etc/nginx/conf.d/mirror-tuning.conf.
# Debian's nginx.conf already sets sendfile, tcp_nopush and server_tokens off (repeating one is an error).
aio threads;
open_file_cache max=20000 inactive=60s;
open_file_cache_valid 60s;
open_file_cache_min_uses 2;
open_file_cache_errors on;
keepalive_requests 1000;
