# Shared by the HTTP and HTTPS servers. Installed as /etc/nginx/snippets/mirror-locations.conf.
root /srv/mirror;
access_log /var/log/nginx/mirror-access.log;
error_log  /var/log/nginx/mirror-error.log;

autoindex on;
autoindex_exact_size off;
charset utf-8;

location / {
    try_files $uri $uri/ =404;
}

# Let's Encrypt HTTP-01 challenges, outside the mirror tree
location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
}

# pool files and images never change in place
location ^~ /debian/pool/ {
    expires 7d;
}
# indices and traces move several times a day
location ~ ^/debian/(dists|project/trace)/ {
    expires 5m;
}

# hidden files (rsync's .~tmp~ of --delay-updates) and ftpsync's lock files are never served
location ~ /\. {
    deny all;
}
location ~ Archive-Update-(in-Progress|Required)- {
    deny all;
}
