# mirror.blue3.com.br: /debian (archive), /debian-cd (images), /blue3-inventory (Blue3's own apt repository).
# Installed as /etc/nginx/sites-available/mirror (enabled; the stock "default" site is removed).
#
# Plain HTTP is served as is, never redirected to HTTPS: apt and the Debian installer fetch over HTTP and check
# everything against the archive's GPG signatures, and a redirect breaks clients without CA certificates.
# HTTPS is offered as well once a certificate exists (docs/operations.md, "TLS certificate").

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name mirror.blue3.com.br mirrors.blue3.com.br;
    include /etc/nginx/snippets/mirror-locations.conf;
}

