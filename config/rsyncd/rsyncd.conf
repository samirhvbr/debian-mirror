# rsync daemon of mirror.blue3.com.br. Installed as /etc/rsyncd.conf (Debian's rsync.service starts when it exists).
# Standard port 873/tcp, read only. The previous mirror listened on 2873.
uid = nobody
gid = nogroup
use chroot = yes
read only = yes
list = yes
max connections = 100
timeout = 600
reverse lookup = no
log file = /var/log/rsyncd.log
transfer logging = no
refuse options = delete
dont compress = *.gz *.tgz *.xz *.bz2 *.zst *.zip *.deb *.udeb *.iso *.jigdo *.template
# rsync's temporary directories (--delay-updates) and ftpsync's lock files
exclude = .~tmp~/ Archive-Update-in-Progress-* Archive-Update-Required-*

[debian]
    path = /srv/mirror/debian
    comment = Debian archive, every architecture

[debian-cd]
    path = /srv/mirror/debian-cd
    comment = Debian CD/DVD/live images, current release
