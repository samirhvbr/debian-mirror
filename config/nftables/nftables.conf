#!/usr/sbin/nft -f
# Host firewall of the mirror. Installed as /etc/nftables.conf (nftables.service).
# Everyone may fetch (HTTP, HTTPS, rsync); SSH and monitoring only from the sets in /etc/nftables.d/mgmt.nft, which
# is not in this public repository (see mgmt.nft.example).
flush ruleset

table inet filter {
    include "/etc/nftables.d/mgmt.nft"

    chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        ct state invalid drop
        iif "lo" accept
        meta l4proto { icmp, ipv6-icmp } accept
        tcp dport { 80, 443, 873 } accept
        tcp dport 22 ip saddr @mgmt_v4 accept
        tcp dport 22 ip6 saddr @mgmt_v6 accept
        tcp dport 10050 ip saddr @monitor_v4 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
